<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identificación</title>
    <style>
        :root {
            --oro: #c5a059;
            --pergamino: #fdf5e6;
            --guinda: #8b0000;
            --oscuro: #1a1a1a;
        }

        body {
            background-color: var(--oscuro);
            color: var(--pergamino);
            font-family: 'Segoe UI', serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--oro);
            text-transform: uppercase;
            letter-spacing: 4px;
            border-bottom: 2px solid var(--guinda);
            padding-bottom: 10px;
            margin-bottom: 40px;
            animation: fadeInDown 1s ease;
        }

        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
        }

        .photo-card {
            background: #2a2a2a;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: transform 0.4s, box-shadow 0.4s;
            animation: fadeInUp 0.8s ease backwards;
        }

        .photo-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(197, 160, 89, 0.3);
        }

        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 3px solid var(--oro);
        }

        .photo-caption {
            padding: 15px;
            text-align: center;
            font-weight: 500;
            font-size: 1.1rem;
            color: var(--pergamino);
        }

        /* Botón Volver */
        .btn-volver {
            margin-top: 50px;
            padding: 15px 40px;
            background-color: var(--guinda);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s;
            border: 2px solid var(--oro);
        }

        .btn-volver:hover {
            background-color: var(--oro);
            color: var(--oscuro);
            transform: scale(1.1);
        }

        /* Animaciones */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Retraso en la aparición de las fotos */
        .photo-card:nth-child(1) { animation-delay: 0.1s; }
        .photo-card:nth-child(2) { animation-delay: 0.2s; }
        .photo-card:nth-child(3) { animation-delay: 0.3s; }
        .photo-card:nth-child(4) { animation-delay: 0.4s; }
        .photo-card:nth-child(5) { animation-delay: 0.5s; }

    </style>
</head>
<body>

    <h1>PALA presentación de lengua</h1>

    <div class="gallery-container">
        
        <div class="photo-card">
            <img src="/proyectos/escrituraantigua.png" alt="Manuscrito">
            <div class="photo-caption">Escritura del Cantar del Mio Cid</div>
        </div>

        <div class="photo-card">
            <img src="/proyectos/anguloimagen.png" alt="Estatua">
            <div class="photo-caption">Imagen con su espada pulida en estatua</div>
        </div>

        <div class="photo-card">
            <img src="/proyectos/desierto.png" alt="Destierro">
            <div class="photo-caption">Rodrigo Díaz de Vivar con su caballo mirando al desierto</div>
        </div>

        <div class="photo-card">
            <img src="/proyectos/conquistavalencia.png" alt="Valencia">
            <div class="photo-caption">El Cid en la conquista de Valencia</div>
        </div>

        <div class="photo-card">
            <img src="/proyectos/batallaganada.png" alt="Victoria">
            <div class="photo-caption">Después de ganar una batalla</div>
        </div>

    </div>

    <a href="/acceso/proyectos/KlKpq132/5/p.htm" class="btn-volver">← Volver al Análisis</a>

</body>
</html>
