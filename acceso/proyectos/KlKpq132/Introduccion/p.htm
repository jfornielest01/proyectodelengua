<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CANTAR DEL MIO CID: GRUPO 1</title>
    <style>
        :root {
            --oro: #c5a059;
            --pergamino: #fdf5e6;
            --guinda: #8b0000;
            --texto: #2c2c2c;
        }

        body {
            background-color: #1a1a1a;
            font-family: 'Segoe UI', sans-serif; /* Fuente por defecto para el cuerpo */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--texto);
            padding: 20px 0; /* Espacio extra arriba y abajo en móviles */
        }

        .container {
            background-color: var(--pergamino);
            width: 90%;
            max-width: 800px; /* Un poco más estrecho para formato lectura */
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            animation: fadeIn 1s ease-in;
            display: flex;
            flex-direction: column;
            align-items: center; /* Centra el contenido */
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        h1 {
            text-align: center;
            color: var(--guinda);
            border-bottom: 2px solid var(--oro);
            text-transform: uppercase;
            margin-bottom: 25px;
            margin-top: 0;
            width: 100%;
            padding-bottom: 10px;
        }

        /* Estilos para la imagen de introducción */
        .intro-image-container {
            width: 100%;
            margin-bottom: 25px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border: 4px solid white;
        }

        .intro-image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Estilos para la sección de participantes */
        .participants-section {
            width: 100%;
            text-align: center;
            margin-top: 10px;
            padding: 20px;
            background: rgba(255,255,255,0.5);
            border-radius: 8px;
            border-top: 3px solid var(--oro);
        }

        .participants-title {
            font-family: Verdana, Geneva, sans-serif;
            color: var(--guinda);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .participants-list {
            font-family: Verdana, Geneva, sans-serif; /* Fuente solicitada */
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--texto);
        }

        /* Nav (Modificado para solo mostrar 'Siguiente') */
        .nav {
            display: flex;
            justify-content: flex-end; /* Alinea a la derecha */
            width: 100%;
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid rgba(197, 160, 89, 0.4);
        }

        .nav img { 
            width: 50px; 
            transition: 0.3s; 
            cursor: pointer; 
        }
        
        .nav img:hover { 
            transform: scale(1.2) translateX(5px); /* Efecto hacia la derecha */
        }

    </style>
</head>
<body>

<div class="container">
    <h1>CANTAR DEL MIO CID: GRUPO 1</h1>

    <div class="intro-image-container">
        <img src="/cargas/portada.png" alt="Introducción Cantar del Mio Cid">
    </div>

    <div class="participants-section">
        <div class="participants-title">Participantes</div>
        <div class="participants-list">
            Carmen Tardío<br>
            Claudia Quintero<br>
            Juan Fornieles<br>
            Víctor Cordón
        </div>
    </div>

    <div class="nav">
        <a href="/acceso/proyectos/KlKpq132/1/p.htm" class="next" title="Siguiente">
            <img src="/proyectos/flecha-derecha.png" alt="Siguiente">
        </a>
    </div>
</div>

</body>
</html>
