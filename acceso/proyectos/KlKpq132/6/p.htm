<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identificación</title>
    <style>
        :root {
            --oro: #c5a059;
            --pergamino: #fdf5e6;
            --guinda: #8b0000;
            --texto: #2c2c2c;
        }

        body {
            background-color: #1a1a1a;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background-color: var(--pergamino);
            width: 80%;
            max-width: 700px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h2 { color: var(--guinda); border-bottom: 2px solid var(--oro); padding-bottom: 5px; }

        .list { list-style: none; padding: 0; margin-bottom: 30px; font-size: 1.2rem; }
        .list li { margin: 5px 0; font-weight: bold; }

        .webgrafia { color: #666; font-style: italic; margin-bottom: 30px; }

        /* Botones */
        .nav-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .btn-nav { width: 50px; cursor: pointer; transition: 0.3s; }
        .btn-nav:hover { transform: scale(1.2); }
        .prev { transform: scaleX(-1); }

        /* Pantalla Final Animada */
        #final-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            color: white;
        }

        .thanks-text {
            font-size: 4rem;
            font-weight: bold;
            text-transform: uppercase;
            animation: shake 0.2s infinite;
        }

        @keyframes shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, -2px) rotate(-1deg); }
            40% { transform: translate(-1px, 2px) rotate(1deg); }
            60% { transform: translate(3px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, 2px) rotate(-1deg); }
        }

        .exit-btn {
            margin-top: 50px;
            padding: 15px 30px;
            background: #222;
            color: #fff;
            border: 2px solid #fff;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        .exit-btn:hover { background: white; color: black; }

        .visto { margin-top: 20px; font-size: 0.8rem; color: #444; }
    </style>
</head>
<body>

<div class="container">
    <h2>WEBGRAFÍA</h2>
    <p class="webgrafia">(Aun vacío)</p>

    <h2>PARTICIPANTES</h2>
    <ul class="list">
        <li>Carmen Tardío</li>
        <li>Claudia Quintero</li>
        <li>Juan Fornieles</li>
        <li>Víctor Cordón</li>
    </ul>

    <div class="nav-footer">
        <a href="/acceso/proyectos/KlKpq132/5/p.htm"><img src="/proyectos/flecha-derecha.png" class="btn-nav prev" alt="Atrás"></a>
        <img src="/proyectos/flecha-derecha.png" class="btn-nav" alt="Siguiente" onclick="lanzarFinal()">
    </div>

    <p class="visto">Visto 1 vez gracias a dios</p>
</div>

<div id="final-overlay">
    <div class="thanks-text">GRACIAS POR VER</div>
    <button class="exit-btn" onclick="acabar()">Salir y acabar con Sandra Moreno Domínguez</button>
</div>

<audio id="ruido" src="https://www.myinstants.com/media/sounds/vine-boom.mp3"></audio>

<script>
    function lanzarFinal() {
        // Reproducir ruido fuerte
        document.getElementById('ruido').play();
        // Mostrar capa negra
        document.getElementById('final-overlay').style.display = 'flex';
    }

    function acabar() {
        window.location.href = "/acceso/personas/educarex.es/entrada.htm";
    }
</script>

</body>
</html>
