<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identificación</title>
    <style>
        body {
            margin: 0;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            background-color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            width: 350px;
            padding: 35px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: left;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: normal;
        }
        label {
            font-size: 14px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 20px;
            border: 1px solid #999;
            font-size: 14px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            box-sizing: border-box; /* Evita que el input se salga del borde */
        }
        input:focus {
            outline: none;
            border: 1px solid black;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: black;
            color: white;
            border: none;
            font-size: 14px;
            cursor: pointer;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        button:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>ACCESO</h2>
    <form id="loginForm">
        <label for="identificacion">IDENTIFICACION</label>
        <input type="text" id="identificacion" required>

        <label for="clave">CLAVE</label>
        <input type="password" id="clave" required>

        <button type="submit" id="btnEntrar">ENTRAR</button>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Tu configuración
    const firebaseConfig = {
        apiKey: "AIzaSyDZGDKwe0xAei-3HdE_ilvAXdeyFmc2H9w",
        authDomain: "formacioncnpgrp.firebaseapp.com",
        projectId: "formacioncnpgrp",
        storageBucket: "formacioncnpgrp.firebasestorage.app",
        messagingSenderId: "688280340095",
        appId: "1:688280340095:web:b0efab6a735bbb8a8e614a",
        measurementId: "G-3JL0CL74SY"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Lógica de Validación
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const idIngresado = document.getElementById("identificacion").value.trim();
        const claveIngresada = document.getElementById("clave").value.trim();
        const btn = document.getElementById("btnEntrar");

        btn.innerText = "VERIFICANDO...";
        btn.disabled = true;

        try {
            // Referencia al documento según tu foto: colección "usuarios", documento "id"
            const docRef = doc(db, "usuarios", idIngresado);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const datosUsuario = docSnap.data();
                
                // Verificamos si la contraseña coincide con el campo "contrasena" de la foto
                if (datosUsuario.contrasena === claveIngresada) {
                    window.location.href = "/acceso/personas/educarex.es/entrada.htm";
                } else {
                    alert("Clave incorrecta.");
                }
            } else {
                alert("El usuario no existe.");
            }
        } catch (error) {
            console.error("Error al conectar con Firebase:", error);
            alert("Error de conexión.");
        } finally {
            btn.innerText = "ENTRAR";
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
