<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyectos</title>

<style>
    body {
        margin: 0;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        background-color: white;
    }

    h1 {
        text-align: center;
        margin: 30px 0;
        font-weight: normal;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        padding: 20px 50px;
        justify-items: center;
    }

    .project {
        width: 200px;
        text-align: center;
        cursor: pointer;
        border: 1px solid #ccc;
        border-radius: 10px;
        overflow: hidden;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        background-color: #f9f9f9;
    }

    .project img {
        width: 100%;
        display: block;
    }

    .project:hover {
        transform: scale(1.05);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .project-title {
        padding: 10px;
        font-size: 14px;
        font-weight: bold;
    }
</style>
</head>

<body>

<h1>Mis Proyectos</h1>

<div class="grid">
    <!-- Proyecto 1 -->
    <div class="project" onclick="location.href='/acceso/proyectos/KlKpq132/Introduccion/p.htm'">
        <img src="/proyectos/1.png" alt="Cantar del Mio Cid">
        <div class="project-title">Cantar del Mio Cid</div>
    </div>

    <!-- Aquí puedes agregar más proyectos -->
    <!--
    <div class="project" onclick="location.href='/acceso/proyectos/OTRO_ID/p.html'">
        <img src="/proyectos/2.png" alt="Otro proyecto">
        <div class="project-title">Otro Proyecto</div>
    </div>
    -->
</div>

</body>
</html>
